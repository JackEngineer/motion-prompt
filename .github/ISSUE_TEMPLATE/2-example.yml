---
name: 推荐社区案例
description: 推荐附有术语和示例的帖子，也欢迎自荐
labels:
- example
body:
- type: markdown
  attributes:
    value: 案例页仅展示 X 官方嵌入、链接及本站撰写的简短介绍，不将图片、视频或帖子正文复制到仓库。只收录投稿者自行制作示例的帖子，不收录使用他人作品或以广告为主的帖子。
- type: input
  id: url
  attributes:
    label: 帖子 URL
    placeholder: https://x.com/<name>/status/<id>
  validations:
    required: true
- type: textarea
  id: why
  attributes:
    label: 推荐理由
    description: 请说明术语所属领域、示例清楚易懂之处等，供撰写介绍时参考。
  validations:
    required: true
- type: dropdown
  id: who
  attributes:
    label: 你的身份
    options:
    - 帖子作者
    - 非帖子作者
  validations:
    required: true
- type: checkboxes
  id: confirm
  attributes:
    label: 请确认
    options:
    - label: 据我所知，示例由帖子作者自行制作，并非转载他人图片或视频。
      required: true
