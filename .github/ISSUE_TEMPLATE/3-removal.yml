---
name: 申请删除或更正
description: 申请删除或更正本站或仓库中的案例、术语和素材
labels:
- removal
body:
- type: markdown
  attributes:
    value: 申请核实后会尽快删除或更正。范围包括案例页的嵌入、链接和介绍，以及仓库中的相应文件。Issue 为公开内容，请勿填写电子邮箱、电话号码或住址等个人信息。
- type: input
  id: target
  attributes:
    label: 需要删除或更正的 URL
    description: 案例请提供帖子 URL，仓库内容请提供文件 URL。
  validations:
    required: true
- type: dropdown
  id: request
  attributes:
    label: 申请内容
    options:
    - 删除
    - 更正
  validations:
    required: true
- type: dropdown
  id: who
  attributes:
    label: 你的身份
    options:
    - 帖子作者本人
    - 帖子中作品的创作者或权利人
    - 上述人士的代理人
    - 其他（报告错误）
  validations:
    required: true
- type: textarea
  id: reason
  attributes:
    label: 申请理由
    description: 申请更正时，请同时提供正确内容。
  validations:
    required: true
- type: textarea
  id: verify
  attributes:
    label: 如何核实你的身份
    description: 例如：使用原帖账号发布含有此 Issue 编号的帖子或回复，核实后可删除。也可以使用链接到该 X 账号的 GitHub 个人资料。
  validations:
    required: true
