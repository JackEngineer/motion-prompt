---
name: 术语或素材包建议与贡献
description: 提议或贡献术语、素材包及制作示例
labels:
- contribution
body:
- type: markdown
  attributes:
    value: 术语和示例标准见 CONTRIBUTING.zh-Hans.md。文件已准备好时也可提交 Pull Request。仓库采用 MIT License，无法按
      MIT 发布的内容不能收录。
- type: dropdown
  id: kind
  attributes:
    label: 你想添加什么？
    options:
    - 新领域的素材包
    - 为现有素材包增加语言
    - 新增或更正术语
    - 制作示例（make-your-own/examples）
    - 其他
  validations:
    required: true
- type: input
  id: field
  attributes:
    label: 领域与语言
    placeholder: 例如：布光，简体中文
  validations:
    required: true
- type: textarea
  id: names
  attributes:
    label: 术语列表或内容介绍
    description: 请尽量为每个术语写一句释义。不确定的术语请标注。
  validations:
    required: true
- type: textarea
  id: sources
  attributes:
    label: 术语来源
    description: 可以是教科书、软件手册、行业术语表、知名教程或自身工作经验。每个术语一行即可。
  validations:
    required: true
- type: textarea
  id: files
  attributes:
    label: 文件或示例地址（可选）
    description: 可提供 Pull Request、fork 或作品链接。若使用自己 X 帖子中的相同素材，请同时提供帖子 URL。
- type: checkboxes
  id: rights
  attributes:
    label: 请确认
    options:
    - label: 内容由我制作，或已获权利人公开授权，并在上文说明。
      required: true
    - label: 未包含他人的图片、视频、字体、标志或人物；如包含，已在上文说明授权情况。
      required: true
    - label: 我同意按 MIT License 发布。
      required: true
    - label: 我理解发布后无法撤回该许可证。
      required: true
